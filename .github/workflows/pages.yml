name: Publish playable website

# work is the approved preview branch. Failed checks never reach deployment.
on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: boat-race-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/work'
    # Playwright 1.56.1 supports this runner; ubuntu-latest may move ahead.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 scripts/audit-artwork.py
      - run: npm run portable
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser gameplay, artwork and hosting checks
        run: npm run test:browser
        env:
          CI: 'true'
      - name: Build for the repository subpath
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify the exact Pages production artifact
        run: npm run test:pages
        env:
          CI: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the static website
        id: deployment
        uses: actions/deploy-pages@v4
